<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Image Gallery</title>
    <style>
        #gallery-container {
            width: 300px;
            text-align: center;
            margin: auto;
        }
        #gallery-image {
            width: 100%;
            height: auto;
            border-radius: 10px;
            transition: opacity 0.5s ease-in-out;
        }
        #controls {
            margin-top: 10px;
        }
        button {
            padding: 10px;
            background: royalblue;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: deepskyblue;
        }
    </style>
</head>
<body>

    <div id="gallery-container">
        <img id="gallery-image" src="image1.jpg" alt="Gallery Image">
        <div id="controls">
            <button onclick="prevImage()">⬅️ Prev</button>
            <button onclick="nextImage()">Next ➡️</button>
        </div>
    </div>

    <script>
        const images = ["git.jpeg", "Group Stadies.jpeg", "collaboration.jpg", "Respect.jpeg"];
        let currentIndex = 0;

        function updateImage() {
            const galleryImage = document.getElementById("gallery-image");
            galleryImage.style.opacity = 0;
            setTimeout(() => {
                galleryImage.src = images[currentIndex];
                galleryImage.style.opacity = 1;
            }, 300);
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateImage();
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            updateImage();
        }
    </script>

</body>
</html>
